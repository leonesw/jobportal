# ==============================================================
#  Stellenradar – Firmenliste
#
#  Diese Firmen fragt das Radar zusätzlich direkt auf ihren
#  Karriereseiten ab, jede Stunde, wie die Arbeitsagentur.
#  Es zählen nur Stellen, die in deinen Regionen liegen
#  (siehe einstellungen.toml) und zu deinen Bereichen passen.
#
#  Eine Firma hinzufügen: einen passenden Block kopieren und
#  anpassen. Mögliche Werte für "system":
#
#    personio   konto = Teil vor ".jobs.personio.de"
#    recruitee  konto = Teil vor ".recruitee.com"
#    greenhouse konto = Board-Name aus "greenhouse.io/<name>"
#    workday    host, mandant, seiten, suche (Suchwörter)
#    phenom     basis, sprache, land, jobpfad
#    rss        feeds (RSS-Adressen, je mit Ort)
#    nextjs     url (Stellensuche mit eingebetteten Daten)
#    successfactors  feed (Stellen-Feed für Jobbörsen, ".../feed/<Nummer>"),
#               ohne_marken (optional, z. B. eine Anwaltsgesellschaft)
#    oracle     host, seite (Oracle Recruiting Cloud, z. B. Kroll)
#    talemetry  basis, suche (Stellensuche als Webseite)
#    ebnerstolz standorte, fachbereiche (nur für Ebner Stolz)
#
#  "bereiche" (optional) gilt nur, wenn der Stellentitel selbst
#  keinen Bereich erkennen lässt – für Boutiquen mit Titeln wie
#  "Analyst (m/w/d)". Bürojobs, IT, Marketing usw. bleiben draußen.
#
#  "sitz" (optional) gilt für Anzeigen ganz ohne Ortsangabe.
#  "aliase" (optional) sind weitere Namen, unter denen die Firma
#  bei der Arbeitsagentur inseriert. Steht eine Stelle dort und
#  auf der Karriereseite, erscheint sie nur einmal.
#
#  Eine Firma vorübergehend abschalten: vor jede Zeile ihres
#  Blocks ein # setzen.
# ==============================================================


# --------------------------------------------------------------
#  Große und mittelgroße Prüfungs- und Beratungsgesellschaften
# --------------------------------------------------------------

[[firma]]
name = "PwC Deutschland"
aliase = ["PricewaterhouseCoopers"]
system = "phenom"
basis = "https://jobs.pwc.de"
sprache = "de_de"
land = "de"
jobpfad = "/de/de/job/"

# Stellen-Feed für Jobbörsen von jobs.kpmg.de (laut robots.txt erlaubt),
# mit allen Standorten je Stelle. KPMG Law (Anwälte) bleibt draußen.
[[firma]]
name = "KPMG"
aliase = ["KPMG AG Wirtschaftsprüfungsgesellschaft"]
system = "successfactors"
feed = "https://jobs.kpmg.de/feed/289301"
ohne_marken = ["kpmgLAW"]

